[project]
name = "inception-home-assistant"
version = "5.1.2"
description = "Home Assistant custom integration for InnerRange Inception security systems"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "colorlog==6.12.0",
    "homeassistant==2025.12.0",
    "pycares<5.0.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff==0.15.14",
]

[tool.uv]
package = false
