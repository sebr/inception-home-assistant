unlock:
  target:
      entity:
        domain: lock
  fields:
    time_secs:
      required: false
      selector:
        number:
          min: 0
          max: 7200
          unit_of_measurement: seconds

area_arm:
  target:
    entity:
      domain: alarm_control_panel
  fields:
    exit_delay:
      required: false
      selector:
        boolean:
    seal_check:
      required: false
      selector:
        boolean:
    code:
      required: false
      selector:
        text:

badge_credential:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: inception
    reader_id:
      required: true
      example: "5a1b8b27-3d0c-4d52-9f72-3f0e5b9d4a52"
      selector:
        text:
    credential_template:
      required: true
      example: "0f8c5e94-5cb7-4f3f-9b66-2e2e3c0a5d33"
      selector:
        text:
    card_number:
      required: true
      example: "0000123"
      selector:
        text:

send_pin:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: inception
    reader_id:
      required: true
      example: "5a1b8b27-3d0c-4d52-9f72-3f0e5b9d4a52"
      selector:
        text:
    pin:
      required: true
      example: "1234"
      selector:
        text:

get_attached_readers:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: inception
    door_id:
      required: true
      example: "fbec7c22-500d-4f3b-b94e-4c19ff501f9f"
      selector:
        text:

get_review_events:
  fields:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: inception
    limit:
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    offset:
      required: false
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    direction:
      required: false
      selector:
        select:
          options:
            - value: asc
              label: Oldest first
            - value: desc
              label: Newest first
    start:
      required: false
      selector:
        datetime:
    end:
      required: false
      selector:
        datetime:
    category_filter:
      required: false
      selector:
        select:
          multiple: true
          options:
            - System
            - Audit
            - Access
            - Security
            - Hardware
    message_type_id_filter:
      required: false
      example: "5000, 5201"
      selector:
        object:
    involved_entity_id_filter:
      required: false
      example: "fbec7c22-500d-4f3b-b94e-4c19ff501f9f"
      selector:
        object:
    reference_id:
      required: false
      selector:
        text:
    reference_time:
      required: false
      selector:
        number:
          min: 0
          max: 9999999999999999999
          mode: box
